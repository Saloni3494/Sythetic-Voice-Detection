services:
  - type: web
    name: synthetic-voice-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: DATABASE_NAME
        value: synthetic_speech_detection
      - key: MONGODB_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
